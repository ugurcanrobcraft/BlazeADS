<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BlazeADS - Sunucu Reklamları</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-black: #03050b;
            --bg-darkblue: #090e24;
            --bg-card: rgba(18, 26, 56, 0.75);
            --bg-input: rgba(10, 16, 38, 0.85);
            --neon-blue: #2563eb;
            --neon-purple: #8b5cf6;
            --glow-blue: rgba(37, 99, 235, 0.35);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-glow: rgba(37, 99, 235, 0.25);
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-black);
            color: var(--text-main);
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background: radial-gradient(circle at top right, #10173a 0%, var(--bg-black) 70%);
            display: flex;
            flex-direction: column;
            position: relative;
            padding-bottom: 40px;
        }

        /* HEADER */
        .app-header {
            background: rgba(9, 14, 36, 0.95);
            backdrop-filter: blur(16px);
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-glow);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .app-header h1 {
            font-size: 1.2rem;
            font-weight: 800;
            background: linear-gradient(90deg, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* MAVİ + BUTON */
        .add-fab-btn {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--glow-blue);
            border: none;
            transition: transform 0.2s;
        }
        .add-fab-btn:active { transform: scale(0.9); }

        /* REKLAM AKIŞ ALANI */
        .feed-container {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .ad-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .ad-header-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .ad-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #fff;
        }

        .ad-owner {
            font-size: 0.75rem;
            color: var(--text-sub);
            background: rgba(255,255,255,0.05);
            padding: 3px 8px;
            border-radius: 6px;
        }

        .ad-desc {
            font-size: 0.85rem;
            color: #cbd5e1;
            line-height: 1.4;
            word-break: break-word;
        }

        .ad-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 10px;
        }

        .ad-time {
            font-size: 0.7rem;
            color: var(--text-sub);
            font-family: 'JetBrains Mono', monospace;
        }

        .join-btn {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .empty-feed {
            text-align: center;
            color: var(--text-sub);
            margin-top: 60px;
            font-size: 0.95srem;
        }

        /* MODAL (PANEL) */
        .modal-bg {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(3, 5, 11, 0.85);
            backdrop-filter: blur(10px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-box {
            background: var(--bg-darkblue);
            width: 100%;
            max-width: 420px;
            padding: 20px;
            border-radius: 20px;
            border: 1px solid var(--border-glow);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-box h3 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-size: 0.75rem;
            color: var(--text-sub);
            font-weight: 600;
        }

        .input-box {
            width: 100%;
            padding: 11px 14px;
            background: var(--bg-input);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            outline: none;
            font-size: 0.85rem;
        }
        .input-box:focus { border-color: var(--neon-blue); }

        textarea.input-box {
            resize: none;
            height: 90px;
        }

        .char-count {
            font-size: 0.7rem;
            color: var(--text-sub);
            text-align: right;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .btn-blue { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; }
        .btn-secondary { background: rgba(255, 255, 255, 0.08); color: var(--text-sub); }

        .cooldown-alert {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            padding: 10px;
            border-radius: 10px;
            font-size: 0.8rem;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- HEADER -->
    <div class="app-header">
        <h1><i class="fa-solid fa-bullhorn" style="color:#3b82f6"></i> BlazeADS</h1>
        <button class="add-fab-btn" onclick="openAdModal()"><i class="fa-solid fa-plus"></i></button>
    </div>

    <!-- REKLAM AKIŞI -->
    <div id="feed-box" class="feed-container">
        <!-- Reklamlar buraya dinamik gelecek -->
    </div>
</div>

<!-- REKLAM OLUŞTURMA MODALI -->
<div id="ad-modal" class="modal-bg">
    <div class="modal-box">
        <h3><i class="fa-solid fa-rectangle-ad" style="color:var(--neon-blue)"></i> Sunucu Reklamı Yayınla</h3>
        
        <div id="cooldown-box" class="cooldown-alert">
            ⚠️ Yeni reklam yayınlamak için <span id="cd-time">1:00:00</span> beklemelisin!
        </div>

        <div class="input-group">
            <label>Sunucu İsmi (En az 3 karakter)</label>
            <input type="text" id="server-name" class="input-box" placeholder="Örn: Türkiye Topluluğu">
        </div>

        <div class="input-group">
            <label>Açıklama (En az 50 karakter)</label>
            <textarea id="server-desc" class="input-box" placeholder="Sunucunuzdan bahsedin..." oninput="updateCharCount()"></textarea>
            <div class="char-count"><span id="char-counter">0</span> / 50 min</div>
        </div>

        <div class="input-group">
            <label>Owner İsim</label>
            <input type="text" id="owner-name" class="input-box" placeholder="Örn: Elmir">
        </div>

        <div class="input-group">
            <label>Davet Linki (https://jubbio.com/invite/ ile başlamalı)</label>
            <input type="text" id="invite-link" class="input-box" placeholder="https://jubbio.com/invite/m2awfr8x">
        </div>

        <button id="publish-btn" class="btn btn-blue" onclick="publishAd()"><i class="fa-solid fa-paper-plane"></i> Yayınla</button>
        <button class="btn btn-secondary" onclick="closeAdModal()">İptal</button>
    </div>
</div>

<script>
    // LocalStorage veri yapısı
    let blazeadsData = JSON.parse(localStorage.getItem('blazeads_db_v1')) || { ads: [], lastPublished: 0 };

    function renderFeed() {
        const feedBox = document.getElementById('feed-box');
        feedBox.innerHTML = '';

        if (blazeadsData.ads.length === 0) {
            feedBox.innerHTML = `<div class="empty-feed">Henüz hiç reklam yayınlanmamış.<br>İlk reklamı sen oluştur! 🚀</div>`;
            return;
        }

        // En son yayınlanan en üstte görünmesi için dizi aynen basılır (yeni eklenenler unshift ile başa ekleniyor)
        blazeadsData.ads.forEach(ad => {
            const card = document.createElement('div');
            card.className = 'ad-card';
            card.innerHTML = `
                <div class="ad-header-info">
                    <span class="ad-title">${escapeHtml(ad.serverName)}</span>
                    <span class="ad-owner"><i class="fa-solid fa-crown" style="color:#fbbf24"></i> ${escapeHtml(ad.ownerName)}</span>
                </div>
                <div class="ad-desc">${escapeHtml(ad.serverDesc)}</div>
                <div class="ad-footer">
                    <span class="ad-time"><i class="fa-regular fa-clock"></i> ${ad.timeStr}</span>
                    <a href="${escapeHtml(ad.inviteLink)}" target="_blank" class="join-btn"><i class="fa-solid fa-right-to-bracket"></i> Sunucuya Katıl</a>
                </div>
            `;
            feedBox.appendChild(card);
        });
    }

    function openAdModal() {
        // Cooldown Kontrolü
        const now = Date.now();
        const diff = now - blazeadsData.lastPublished;
        const cooldownTime = 3600 * 1000; // 1 Saat (milisaniye)

        const cdBox = document.getElementById('cooldown-box');
        const pubBtn = document.getElementById('publish-btn');

        if (diff < cooldownTime) {
            const remainingSecs = Math.ceil((cooldownTime - diff) / 1000);
            const mins = Math.floor(remainingSecs / 60);
            const secs = remainingSecs % 60;
            document.getElementById('cd-time').innerText = `${mins} dk ${secs} sn`;
            cdBox.style.display = 'block';
            pubBtn.style.opacity = '0.5';
            pubBtn.style.pointerEvents = 'none';
        } else {
            cdBox.style.display = 'none';
            pubBtn.style.opacity = '1';
            pubBtn.style.pointerEvents = 'auto';
        }

        document.getElementById('ad-modal').style.display = 'flex';
    }

    function closeAdModal() {
        document.getElementById('ad-modal').style.display = 'none';
    }

    function updateCharCount() {
        const text = document.getElementById('server-desc').value;
        const counter = document.getElementById('char-counter');
        counter.innerText = text.length;
        if(text.length >= 50) {
            counter.style.color = 'var(--success)';
        } else {
            counter.style.color = 'var(--text-sub)';
        }
    }

    function publishAd() {
        const serverName = document.getElementById('server-name').value.trim();
        const serverDesc = document.getElementById('server-desc').value.trim();
        const ownerName = document.getElementById('owner-name').value.trim();
        const inviteLink = document.getElementById('invite-link').value.trim();

        // Doğrulamalar
        if (serverName.length < 3) {
            return alert("Sunucu ismi en az 3 karakter olmalıdır!");
        }
        if (serverDesc.length < 50) {
            return alert("Açıklama en az 50 karakter olmalıdır!");
        }
        if (!ownerName) {
            return alert("Lütfen Owner ismini girin!");
        }
        if (!inviteLink.startsWith("https://jubbio.com/invite/")) {
            return alert("Davet linki mutlaka 'https://jubbio.com/invite/' ile başlamalıdır!");
        }

        // Yeni reklam nesnesi
        const newAd = {
            serverName,
            serverDesc,
            ownerName,
            inviteLink,
            timeStr: new Date().toLocaleDateString('tr-TR') + ' ' + new Date().toLocaleTimeString('tr-TR', {hour: '2-digit', minute:'2-digit'})
        };

        // En son yayınlanan en üstte olması için unshift kullanıyoruz
        blazeadsData.ads.unshift(newAd);
        blazeadsData.lastPublished = Date.now();

        // Kaydet ve yenile
        localStorage.setItem('blazeads_db_v1', JSON.stringify(blazeadsData));
        closeAdModal();
        renderFeed();

        // Formu temizle
        document.getElementById('server-name').value = '';
        document.getElementById('server-desc').value = '';
        document.getElementById('owner-name').value = '';
        document.getElementById('invite-link').value = '';
        document.getElementById('char-counter').innerText = '0';
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // Sayfa açıldığında akışı yükle
    renderFeed();
</script>
</body>
</html>
